name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['backend/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to HF Spaces
        uses: huggingface/setup-cli@v2
        with:
          token: ${{ secrets.HF_TOKEN }}
      - run: |
          huggingface-cli upload \
            ${{ secrets.HF_USERNAME }}/neotwin-api \
            ./backend .
