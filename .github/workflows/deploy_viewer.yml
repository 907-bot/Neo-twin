name: Deploy Viewer → GitHub Pages

on:
  push:
    branches: [main]
    paths: ['viewer/**']
  workflow_dispatch:   # allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package.json

      - name: Install dependencies
        run: cd viewer && npm install

      - name: Build (production)
        run: cd viewer && npm run build
        env:
          # Hugging Face backend API URL
          VITE_API_URL: 'https://1qwsd-neotwin-api.hf.space'
          # Base sub-directory path for GitHub Pages
          VITE_BASE_URL: '/Neo-twin/'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './viewer/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
